name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate Next.js 15.5.26 security release
        run: |
          npm install next@15.5.26 --save-exact
          npm audit --omit=dev
          npm run build
