name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate Next.js 15.5.26 lockfile artifact
        run: |
          npm install next@15.5.26 --save-exact --package-lock-only --ignore-scripts
          cp package-lock.json /tmp/package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: next-15.5.26-lockfile
          path: /tmp/package-lock.json
      - run: npm run build
